server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          __path__: /var/log/app-logs/*/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            thread: thread_name
            message: message
            service: service
            path: path
      - labels:
          level:
          logger:
          service:
          compose_service: service
          application: service
      - output:
          source: message

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      - source_labels: ['__meta_docker_container_name']
        target_label: container
        regex: '/(.*)'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: application
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_log_path']
        target_label: __path__
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{compose_service=~"account-service|transaction-service|audit-log-service|notification-service|api-gateway|eureka-server"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger_name
                  thread: thread_name
                  message: message
                  service: service
                  path: path
            - labels:
                level:
                logger:
                service:
            - output:
                source: message

