server:
  port: 8080 # API Gateway will run on 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      # GLOBAL RATE LIMITER (applies to every route and unmatched paths)
      default-filters:
        - name: RequestRateLimiter
          args:
            "[redis-rate-limiter.replenishRate]": 1000 # 1000 requests per second
            "[redis-rate-limiter.burstCapacity]": 2000 # allow short bursts up to 10
            key-resolver: "#{@ipKeyResolver}"

        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**

        - id: user-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/users/**

        - id: audit-log-service
          uri: lb://audit-log-service
          predicates:
            - Path=/api/v1/logs/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          filters:
            - name: RequestRateLimiter
              args:
                "[redis-rate-limiter.replenishRate]": 5
                "[redis-rate-limiter.burstCapacity]": 10
                key-resolver: "'#{@ipKeyResolver}'"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
